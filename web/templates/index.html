<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="wrap">
  <h1>__TITLE__</h1>
  <div class="sub" id="sub">加载中…</div>

  <div class="stats" id="stats"></div>
  <div class="rooms" id="rooms"></div>

  <div class="panel" id="panel-new">
    <h2 id="panelNewTitle">添加宿舍</h2>
    <p class="note" id="panelNewNote">扫码后选房间。</p>
    <div class="row" style="margin-top:10px">
      <button class="primary" id="btnStart">开始扫码</button>
      <button id="btnCancelChange" style="display:none">取消</button>
      <span class="note" id="startHint"></span>
    </div>
    <div id="loginBox" style="display:none">
      <img class="qr" id="qrImg" alt="支付宝登录二维码">
      <p class="note" id="qrHint">请用手机支付宝扫码登录（若提示授权请点同意）。二维码由服务器实时截取。</p>
      <div class="warn" id="qrWarn" style="display:none"></div>
    </div>
    <div id="pickBox" style="display:none">
      <p class="note" id="pickNote">已登录。请填写姓名学号并选择房间：</p>
      <div class="row" style="margin-top:8px">
        <div class="fld"><label>姓名</label><input id="fCustName" maxlength="15"></div>
        <div class="fld"><label>学号</label><input id="fCustNo" maxlength="20"></div>
      </div>
      <div class="row" id="levelRow" style="margin-top:10px"></div>
      <div class="row" style="margin-top:12px">
        <button class="primary" id="btnCommit">下一步，查看电量</button>
        <span class="note" id="commitHint"></span>
      </div>
    </div>
  </div>

  <div class="row" id="mineActions" style="display:none;margin-bottom:20px">
    <button id="btnRefresh">立即刷新</button>
    <button class="primary" id="btnChangeRoom">换个宿舍</button>
    <button class="danger" id="btnForget">删除我的全部数据</button>
    <span class="note" id="mineHint"></span>
  </div>

  <div class="foot">
    本站不接触任何人的支付宝账号密码。登录二维码由服务器端浏览器实时生成，扫码授权在校方与支付宝之间完成。<br>
    数据来源：学校电控系统的估算值，页面原话「请以实际电表为准」。
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
